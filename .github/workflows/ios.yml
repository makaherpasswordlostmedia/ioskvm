name: PSPKVM iOS armv7 (J2ME emulator, iOS 7.0+)

# Pipeline adapted from caprice32ios/ios-build.yml: same Theos + L1ghtmann vanilla-clang toolchain,
# libc++ __config_site fix, iPhoneOS 9.3 SDK + module.map fix, freetype from source.
# Extra here: 32-bit host tools (gcc -m32) and JDK 8 for the phoneME/CLDC class + ROM generation.

on:
  push:
    paths: ["ios/**", "javacall/**", "cldc/**", "midp/**", "pcsl/**", "jsr135/**", "jsr184/**", "jsr226/**", "pisces/**", "ext/**", "build-ios-cldc.sh", ".github/workflows/ios.yml"]
  workflow_dispatch: {}

env:
  IOS_SDK_VERSION: "9.3"
  IOS_DEPLOY_TARGET: "7.0"

jobs:
  build-ios-armv7:
    name: Build (Theos / iOS 7.0+ / armv7)
    runs-on: ubuntu-24.04      # the L1ghtmann toolchain needs glibc >= 2.38 (as in your WL4 workflow)
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Apply JSR 184 (M3G) patch and run host tests
        run: |
          # Everything for JSR 184 (jsr184/, makefile + build script edits) travels inside this file.
